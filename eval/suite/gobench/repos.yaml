#                     caution for a public dataset even though referencing is
#                     likely fine. Revisit only if R0.4 clears BUSL referencing.
# cockroachdb/cockroach REJECT: BUSL-1.1/CCL (Other/NOASSERTION) + enormous, very
#                     slow tests (>>10 min, needs a running cluster). Two strikes.
# grafana/grafana     REJECT: AGPL-3.0 acceptable for referencing BUT repo is
#                     TypeScript-DOMINANT (primary language TS); Go is a minority

# GoBench source-repo pool (R0.2, GOBENCH.md)
# =============================================================================
# WHAT THIS IS
#   A curated pool of Go source repositories from which the GoBench miner
#   (Phase 2) draws candidate benchmark instances. Each entry is a repo we have
#   vetted against the R0.2 selection criteria; the miner crawls merged PRs with
#   linked issues, and the auto-validator (Phase 3) decides which survive.
#
# SELECTION CRITERIA (R0.2)
#   - active: regular merged PRs with linked issues (checked pushed_at 2026-07);
#   - pure Go or Go-dominant, NO cgo-heavy core (cgo:true entries excluded from
#     the default mining pool; cgo:partial kept but must avoid cgo packages);
#   - standard `go test` runnable (testify OK — see the testify trap below);
#   - non-trivial (real bugs, not typo farms);
#   - permissive-or-copyleft license that allows REFERENCING commits;
#   - builds hermetically with a modern Go toolchain (go.mod-pinned);
#   - full/relevant test suite runnable in <10 min on a single machine (per-repo
#     we mine PACKAGE-scoped test sets, not repo-wide, so a slow monorepo can
#     still yield fast instances — typical_ci_min is the repo-wide figure and is
#     an upper bound, not the per-instance grade cost).
#
# DISTRIBUTION MODEL (R0.4, SWE-bench-style — NOT code redistribution)
#   GoBench ships METADATA + FETCH SCRIPTS, never copies of repo source. An
#   instance record is: repo URL + base/gold commit SHAs + issue text + test
#   names + validation metadata. The grader fetches upstream code at run time
#   from the origin (git). Because we distribute only references and our own
#   scripts, ANY license that permits referencing public commits is acceptable
#   here — permissive (MIT/BSD/Apache), weak-copyleft, and strong-copyleft
#   (GPL/AGPL) source repos are all fine for METADATA. The dataset itself is
#   planned CC-BY-4.0 (R0.4). Issue-text redistribution is the one live legal
#   question (GitHub ToS) tracked in R0.4 — not blocked per-repo here.
#   NOTE: source-available / non-OSI licenses (BUSL-1.1, "Other/NOASSERTION"
#   that resolves to BUSL) are EXCLUDED below out of caution — they restrict
#   downstream use in ways we don't want to litigate for a public dataset,
#   even though pure referencing is likely fine.
#
# THE testify TRAP (bake into the miner's F2P name derivation)
#   With stretchr/testify suites, the runnable test is the top-level
#   `func TestXxx(t)` that calls `suite.Run(t, &S{})`; individual `(s *S) TestM`
#   methods are NOT independently addressable by `go test -run TestM`. To target
#   one method you need `-run 'TestXxx/TestM'` (the suite func name is the
#   REQUIRED prefix). A naive `-run Method` regex silently matches nothing and
#   exits 0 = FALSE PASS. Any repo tagged `testify-suite` in notes needs the
#   validator's "verify the named tests actually RAN" check (grader contract
#   1.2, Phase 3 step 2) or it will mint false-green oracles. Plain
#   `assert`/`require` (no suite.Run) does NOT have this problem — only the
#   suite pattern does.
#
# FIELDS
#   repo            owner/name
#   license         SPDX id (verified via GitHub license API 2026-07-06)
#   test_framework  stdlib | testify | testify-suite | other (+ notes)
#   typical_ci_min  rough repo-wide test wall-clock estimate (single machine);
#                   "unknown" where not measured. Per-instance grade cost is
#                   package-scoped and usually far lower.
#   cgo             false | true | partial
#   status          proven | candidate | low-yield
#   notes           traps, linked-issue discipline, expected yield, rationale
#
# See the REJECTED CANDIDATES block at the bottom for repos considered and
# dropped, with reasons (this feeds the release's rejected-candidates log).
# =============================================================================


# =============================================================================
# REJECTED CANDIDATES (considered, dropped — feeds the release rejected log)
# =============================================================================
# minio/minio         REJECT: ARCHIVED (2026-04) + AGPL-3.0. Archived = no fresh
#                     merged PRs, so zero rolling yield regardless of license.
# hashicorp/consul    REJECT: license "Other/NOASSERTION" = BUSL-1.1 (Business

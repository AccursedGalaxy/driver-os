# Continuous integration: vet + build + test the Go module on every push and PR
# to master (ROADMAP §A item 1 — the repo had NO test CI, only the issue bot).
# This is the pre-merge bar; keep it deterministically green.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Default shallow (single commit) is deliberate: nothing in the tested
        # scope needs git history. The only history-replay tests
        # (eval/suite/selfhist) are excluded below for an unrelated reason, so a
        # full-history fetch would only slow the job down.
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # installs the pinned toolchain; caches modules

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1
